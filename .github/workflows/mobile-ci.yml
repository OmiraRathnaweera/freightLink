name: Mobile CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'mobile/freightlink_mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'mobile/freightlink_mobile/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/freightlink_mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
