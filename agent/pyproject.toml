[project]
name = "freightlink-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nuwantha", email = "hnpkdias@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.10",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
freightlink-agent = "freightlink_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pyrefly]
python-interpreter-path = ".venv/Scripts/python.exe"
search-path = ["src"]

